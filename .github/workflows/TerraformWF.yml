name: Terraform

on:
  workflow_dispatch:

  push:
    branches:
      - test
      - release
      - master

  pull_request:
    branches:
      - master

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-2
  ECR_REPOSITORY: webapp
  ECS_CLUSTER: webapp-cluster
  ECS_SERVICE: webapp

jobs:

  # ==========================================
  # TERRAFORM PLAN
  # Runs for push, PR and manual execution
  # ==========================================

  terraform-plan:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan


  # ==========================================
  # TEST / RELEASE DEPLOYMENTS
  # No approval required
  # ==========================================

  terraform-deploy:
    needs: terraform-plan

    if: >
      github.event_name == 'push' &&
      github.ref != 'refs/heads/master'

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          docker build \
            -t $ACCOUNT_ID.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:latest \
            ./docker

      - name: Push Docker Image
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          docker push \
            $ACCOUNT_ID.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:latest

      - name: Force ECS Deployment
        run: |
          aws ecs update-service \
            --cluster ${ECS_CLUSTER} \
            --service ${ECS_SERVICE} \
            --force-new-deployment \
            --region ${AWS_REGION}


  # ==========================================
  # MASTER DEPLOYMENT
  # Production approval required
  # ==========================================

  terraform-master-deploy:
    needs: terraform-plan

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master'

    runs-on: ubuntu-latest

    # This connects the job to the protected
    # GitHub production environment.
    environment:
      name: production

    defaults:
      run:
        working-directory: .

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      # ======================================
      # TEMPORARY OIDC TROUBLESHOOTING
      # Remove once AWS trust is confirmed
      # ======================================

      - name: Display OIDC Claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');

            const payload = JSON.parse(
              Buffer.from(
                token.split('.')[1],
                'base64url'
              ).toString()
            );

            core.info(`aud: ${payload.aud}`);
            core.info(`sub: ${payload.sub}`);
            core.info(`repository: ${payload.repository}`);
            core.info(`repository_owner: ${payload.repository_owner}`);
            core.info(`repository_id: ${payload.repository_id}`);
            core.info(`repository_owner_id: ${payload.repository_owner_id}`);
            core.info(`ref: ${payload.ref}`);
            core.info(`environment: ${payload.environment}`);


      # ======================================
      # AWS AUTHENTICATION
      # Happens after production approval
      # ======================================

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # ======================================
      # TERRAFORM DEPLOYMENT
      # ======================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve


      # ======================================
      # CONTAINER DEPLOYMENT
      # ======================================

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          docker build \
            -t $ACCOUNT_ID.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:latest \
            ./docker

      - name: Push Docker Image
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          docker push \
            $ACCOUNT_ID.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:latest

      - name: Force ECS Deployment
        run: |
          aws ecs update-service \
            --cluster ${ECS_CLUSTER} \
            --service ${ECS_SERVICE} \
            --force-new-deployment \
            --region ${AWS_REGION}