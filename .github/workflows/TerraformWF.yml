name: Terraform

on:
  workflow_dispatch:

  push:
    branches:
      - '**'

  pull_request:
    branches:
      - master

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .

    env:
      AWS_REGION: eu-central-2
      ECR_REPOSITORY: webapp
      ECS_CLUSTER: webapp-cluster
      ECS_SERVICE: webapp

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      # AWS authentication is required for Terraform Plan
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      - name: Terraform Init
        run: terraform init


      - name: Terraform Format
        run: terraform fmt -check -recursive


      - name: Terraform Validate
        run: terraform validate


      # PR workflow stops after this step
      - name: Terraform Plan
        run: terraform plan -out=tfplan


      # Everything below here is skipped for PRs

      - name: Terraform Apply
        if: github.event_name != 'pull_request'
        run: terraform apply -auto-approve tfplan


      - name: Login to Amazon ECR
        if: github.event_name != 'pull_request'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      - name: Build Docker Image
        if: github.event_name != 'pull_request'
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          docker build \
            -t $ACCOUNT_ID.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:latest \
            ./docker


      - name: Push Docker Image
        if: github.event_name != 'pull_request'
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          docker push \
            $ACCOUNT_ID.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:latest


      - name: Force ECS Deployment
        if: github.event_name != 'pull_request'
        run: |
          aws ecs update-service \
            --cluster ${ECS_CLUSTER} \
            --service ${ECS_SERVICE} \
            --force-new-deployment \
            --region ${AWS_REGION}