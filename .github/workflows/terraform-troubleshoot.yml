name: Terraform - Release - Full

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-2
  ECR_REPOSITORY: webapp
  ECS_CLUSTER: webapp-cluster
  ECS_SERVICE: webapp

jobs:

  # ==========================================
  # TERRAFORM PLAN
  # ==========================================

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    # ------------------------------------------
    # Terraform sensitive variables
    # ------------------------------------------
    env:
      TF_VAR_domain_administrator_password: ${{ secrets.DOMAIN_ADMINISTRATOR_PASSWORD }}
      TF_VAR_fsx_service_account_password: ${{ secrets.FSX_SERVICE_ACCOUNT_PASSWORD }}

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ------------------------------------------
      # AWS/OIDC troubleshooting
      # Confirm which AWS identity is being used
      # ------------------------------------------
      - name: Check AWS Identity
        run: |
          echo "Checking AWS identity..."
          aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Version
        run: terraform version

      - name: Terraform Init
        run: terraform init -input=false -no-color

      - name: Terraform Format
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate -no-color

      # ------------------------------------------
      # Terraform Plan with troubleshooting
      # Captures stdout + stderr while preserving
      # the actual Terraform exit code
      # ------------------------------------------
      - name: Terraform Plan
        shell: bash
        run: |
          set +e

          echo "========================================"
          echo "Running Terraform Plan"
          echo "========================================"

          terraform plan \
            -input=false \
            -no-color 2>&1 | tee terraform-plan.log

          EXIT_CODE=${PIPESTATUS[0]}

          echo ""
          echo "========================================"
          echo "Terraform Plan exit code: $EXIT_CODE"
          echo "========================================"

          if [ "$EXIT_CODE" -ne 0 ]; then
            echo ""
            echo "Terraform Plan failed."
            echo "Last 100 lines of Terraform output:"
            echo "========================================"
            tail -100 terraform-plan.log
            exit "$EXIT_CODE"
          fi

          echo "Terraform Plan completed successfully."


  # ==========================================
  # MASTER DEPLOYMENT
  #
  # The production environment retains the
  # existing approval requirement.
  # ==========================================

  terraform-master-deploy:
    name: Approved Master Deployment
    needs: terraform-plan

    if: >
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/master')

    runs-on: ubuntu-latest

    environment:
      name: production

    # ------------------------------------------
    # Terraform sensitive variables
    # ------------------------------------------
    env:
      TF_VAR_domain_administrator_password: ${{ secrets.DOMAIN_ADMINISTRATOR_PASSWORD }}
      TF_VAR_fsx_service_account_password: ${{ secrets.FSX_SERVICE_ACCOUNT_PASSWORD }}

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # This step takes place only after the
      # production environment approval.
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ------------------------------------------
      # Confirm the OIDC role being used by the
      # deployment job
      # ------------------------------------------
      - name: Check AWS Identity
        run: |
          echo "Checking AWS identity used for deployment..."
          aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Version
        run: terraform version

      - name: Terraform Init
        run: terraform init -input=false -no-color

      # ------------------------------------------
 